name: Deploy to Test Environment (Cloudflare Pages)

on:
  push:
    branches: [ "main" ]
  schedule:
    # GitHub Actions cron uses UTC; 15:00 UTC is midnight in Japan.
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Test Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - id: google-auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly

      - name: Google Sheets data sync and validation
        run: npm run sheets:sync
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}

      - name: Lint（静的解析）の実行
        run: npm run lint

      - name: 単体テストの実行
        run: npm test

      - name: 型チェックとビルドの実行
        run: npm run build

      - name: Cloudflare Pages へのデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bunbetu-game --branch=main
