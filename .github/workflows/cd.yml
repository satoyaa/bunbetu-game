name: Deploy to Test Environment (Cloudflare Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Test Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint（静的解析）の実行
        run: npm run lint

      - name: 単体テストの実行
        run: npm test

      - name: 型チェックとビルドの実行
        run: npm run build

      - name: Cloudflare Pages へのデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bunbetu-game-test --branch=main
